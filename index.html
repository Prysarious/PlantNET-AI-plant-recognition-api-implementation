<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant disease identification</title>
  <style>
    :root{font:16px/1.5 system-ui,sans-serif;color:#20352a;background:#f3f7f2}
    *{box-sizing:border-box}body{margin:0;padding:48px 18px}
    .page{width:min(100%,760px);margin:auto}
    header{margin-bottom:24px}.eyebrow{margin:0;color:#287447;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0;font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.15}
    .intro,.hint{color:#607066}.intro{margin:0}
    .panel,.result{background:#fff;border:1px solid #e4ebe3;border-radius:14px;box-shadow:0 10px 30px #18351a0d}
    .panel{padding:26px}.label{display:block;margin-bottom:8px;font-weight:650}
    .upload{display:grid;place-content:center;gap:6px;min-height:145px;padding:20px;text-align:center;background:#f8fbf7;border:2px dashed #bfd2c1;border-radius:12px}
    .upload:focus-within,.upload:hover{background:#f2f8f2;border-color:#287447}
    input{max-width:100%;margin-top:8px} .hint{margin:0;font-size:.88rem}
    .actions{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:20px}
    .control{flex:1;max-width:260px}select,button{min-height:44px;padding:8px 12px;font:inherit;border-radius:8px}
    select{width:100%;color:inherit;background:#fff;border:1px solid #cbd7cd}
    button{padding-inline:20px;color:white;background:#287447;border:0;font-weight:650;cursor:pointer}
    button:hover:not(:disabled){background:#205e39}button:disabled{opacity:.6;cursor:wait}
    #results{display:grid;gap:16px;margin-top:24px}
    .result{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px;box-shadow:none}
    .preview{width:150px;height:150px;object-fit:cover;background:#f3f7f2;border-radius:8px}
    .content{min-width:0}.filename{margin:0 0 12px;overflow-wrap:anywhere;font-size:1rem}
    .plant,.disease{margin:0 0 8px;padding:10px 12px;background:#f6f9f5;border-radius:8px}
    .plant strong,.disease strong{display:block}.score{color:#607066;font-size:.88rem}.error{color:#a32d2d}
    .quota{margin:12px 0 0;color:#607066;font-size:.88rem}
    @media(max-width:560px){body{padding:30px 14px}.panel{padding:18px}.actions{align-items:stretch;flex-direction:column}.control{max-width:none}.actions button{width:100%}.result{grid-template-columns:1fr}.preview{width:100%;height:190px}}
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Pl@ntNet image analysis</p>
      <h1>Plant disease identification</h1>
      <p class="intro">Upload clear plant photos to identify the species and check for supported diseases.</p>
    </header>
    <section class="panel" aria-label="Plant image form">
      <form id="form">
        <label class="label" for="images">Choose plant photos</label>
        <div class="upload">
          <strong>Select one or more images</strong>
          <p class="hint">Use clear photos of the same plant part for best results.</p>
          <input id="images" type="file" accept="image/*" multiple required>
        </div>
        <div class="actions">
          <div class="control">
            <label class="label" for="organ">Plant part</label>
            <select id="organ">
              <option value="auto">Detect automatically</option><option value="leaf">Leaf</option>
              <option value="flower">Flower</option><option value="fruit">Fruit</option><option value="bark">Bark</option>
            </select>
          </div>
          <button id="submit">Identify plants</button>
        </div>
      </form>
    </section>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const form=document.querySelector("#form"),files=document.querySelector("#images"),organ=document.querySelector("#organ"),
      output=document.querySelector("#results"),button=document.querySelector("#submit");
    const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text)node.textContent=text;return node};
    form.onsubmit=async event=>{
      event.preventDefault();output.replaceChildren();button.disabled=true;
      try{
        for(const file of files.files){
          const card=el("article","result"),image=el("img","preview"),content=el("div","content"),
            title=el("h2","filename",file.name),status=el("p","","Identifying…");
          image.src=URL.createObjectURL(file);image.alt=`Preview of ${file.name}`;
          content.append(title,status);card.append(image,content);output.append(card);
          try{
            const data=new FormData();data.append("image",file);data.append("organ",organ.value);
            const response=await fetch("/identify",{method:"POST",body:data}),body=await response.text();
            let result;try{result=JSON.parse(body)}catch{throw Error(`Request failed (${response.status}): ${body.slice(0,200)||response.statusText}`)}
            if(!response.ok)throw Error(result.detail||`Request failed (${response.status})`);
            status.remove();
            const plant=result.plant,plantName=plant
              ?`${plant.name}${plant.common_names?.length?` (${plant.common_names.join(", ")})`:""}`:"No plant match found";
            const plantCard=el("p","plant");plantCard.append(el("strong","",plantName));
            if(plant)plantCard.append(el("span","score",`Plant match · ${plant.score}`));
            content.append(plantCard);
            if(result.results.length)result.results.forEach(d=>{
              const item=el("p","disease");item.append(el("strong","",d.disease_name),el("span","score",`${d.eppo_code} · ${d.score}`));content.append(item);
            });else content.append(el("p","disease","No supported disease match found."));
            if(result.remaining_quota!=null)content.append(el("p","quota",`Remaining Pl@ntNet quota: ${result.remaining_quota}`));
          }catch(error){status.className="error";status.textContent=`Error: ${error.message}`}
        }
      }finally{button.disabled=false}
    };
  </script>
</body>
</html>
